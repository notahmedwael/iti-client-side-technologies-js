<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        form {
            display: flex;
            flex-direction: column;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            height: auto;
            gap: 20px;
            background-color: #f4f4f4;
            border: 2px solid #009879;
            border-radius: 12px;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        form .input-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        form .input-field input:not([type="radio"]),
        form .input-field select {
            width: 65%;
            padding: 8px 12px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s;
        }

        .radio-group {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 65%;
        }

        .radio-label {
            font-size: 1rem !important;
            font-weight: 400 !important;
            margin-right: 10px;
        }

        label {
            font-size: 1.1rem;
            font-weight: 600;
            flex: 1;
        }

        input:focus, select:focus {
            border-color: #009879;
        }

        input.error {
            border-color: red;
            background-color: #ffe6e6;
        }

        .error-text {
            display: none;
            color: red;
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 5px;
            text-align: right;
        }

        form .buttons {
            margin-top: 10px;
            align-self: center;
            display: flex;
            gap: 20px;
        }

        button {
            padding: 10px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            background-color: #009879;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #007f63;
        }
    </style>
</head>
<body>

    <div class="container">
        <form>
            <div class="input-field-container">
                <div class="input-field">
                    <label for="title-select">Title</label>
                    <select id="title-select" name="title">
                        <option value="mr">Mr.</option>
                        <option value="mrs">Mrs.</option>
                        <option value="ms">Ms.</option>
                        <option value="dr">Dr.</option>
                    </select>
                </div>
            </div>

            <div class="input-field-container">
                <div class="input-field">
                    <label for="name-input">Name</label>
                    <input type="text" name="name" id="name-input" required>
                </div>
                <p class="error-text"></p>
            </div>

            <div class="input-field-container">
                <div class="input-field">
                    <label for="email-input">Email</label>
                    <input type="text" name="email" id="email-input" required>
                </div>
                <p class="error-text"></p>
            </div>

            <div class="input-field-container">
                <div class="input-field gender-section">
                    <label>Gender</label>
                    <div class="radio-group">
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male" class="radio-label">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female" class="radio-label">Female</label>
                    </div>
                </div>
                <p class="error-text"></p>
            </div>

            <div class="input-field-container">
                <div class="input-field">
                    <label for="mobile-input">Mobile</label>
                    <input type="tel" name="mobile" id="mobile-input" placeholder="01xxxxxxxxx" required>
                </div>
                <p class="error-text"></p>
            </div>

            <div class="input-field-container">
                <div class="input-field">
                    <label for="address-input">Address</label>
                    <input type="text" name="address" id="address-input" required>
                </div>
                <p class="error-text"></p>
            </div>

            <div class="buttons">
                <button type="button" id="add">Submit</button>
                <button type="button" id="reset">Reset</button>
            </div>
        </form>
    </div>

    <script src="../scripts/registration.js" defer></script>
</body>
</html>
