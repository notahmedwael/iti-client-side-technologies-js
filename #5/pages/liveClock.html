<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Clock</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        p{
            font-size: 3rem;
            font-weight: 600;
            color: #333;
        }

        button{
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            background-color: #009879;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        button:hover{
            background-color: #007f63;
        }

        p.stop{
            display: none;
            margin-top: 15px;
            font-size: 1rem;
            color: #666;
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="clock">
            <p>
                00:00 PM
            </p>
        </div>
        <button type="button" id="start-clock">Start Live Clock</button>
        <p class = "stop">
            Press ALT + W to stop
        </p>
    </div>

    <script src="../scripts/liveClock.js" defer></script>
</body>
</html>
