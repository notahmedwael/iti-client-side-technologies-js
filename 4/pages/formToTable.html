<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validate Form</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body{
            overflow: scroll;
        }

        form{
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            width: 30vw;
            height: 60vh;
            gap: 30px;
            margin-top: 20px;
            margin-bottom: 100px;
            background-color: #f4f4f4;
            border: 2px solid #009879;
            border-radius: 12px;
            color: #333;
        }

        form .input-field{
            display: flex;
            justify-content: space-between;
            gap: 50px;
        }

        form .buttons{
            align-self: center;
            display: flex;
            gap: 30px;
        }

        label{
            font-size: 1.2rem;
            font-weight: 600;
        }
        input{
            padding: 8px 12px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        input:focus{
            border-color: #009879;
        }

        input.error{
            border-color: red;
            background-color: #ffe6e6;
        }

        .error-text{
            display: none;
            color:red;
            font-weight: 900;
            margin: 10px 0;
        }

        button{
            padding: 10px 15px;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            background-color: #009879;
            color: white;
            cursor: pointer;
        }
        button:hover{
            background-color: #007f63;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 0.9em;
            min-width: 400px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        caption {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        table thead tr {
            background-color: #009879;
            color: #ffffff;
            text-align: left;
            font-weight: bold;
        }

        table th, table td {
            padding: 12px 15px;
        }
        
        table tbody tr {
            border-bottom: 1px solid #dddddd;
        }

        table tbody tr:nth-of-type(even) {
            background-color: #f3f3f3;
        }
    </style>
</head>
<body>

    <div class="container">
            <form>
                <div class="input-field-container">
                    <div class="input-field">
                        <label for="name-input">Name</label>
                        <input type="text" name="name" id="name-input" required>
                    </div>
                        <p class="error-text"></p>
                </div>

                <div class="input-field-container">
                    <div class="input-field">
                        <label for="age-input">Age</label>
                        <input type="text" name="number" id="age-input" required>
                    </div>
                    <p class="error-text"></p>
                </div>

                <div class="input-field-container">
                    <div class="input-field">
                        <label for="email-input">Email</label>
                        <input type="text" name="email" id="email-input" required>
                    </div>
                    <p class="error-text"></p>
                </div>

                <div class="buttons">
                    <button type="button" id="add">Add</button>
                    <button type="button" id="reset">Reset</button>
                </div>
            </form>
        <div>
            <table>
                <caption>Users Data</caption> <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Email</th>
                    </tr>
                </thead>
    
                <tbody>

                </tbody>
            </table>
        </div>

    </div>
    
    <script src="../scripts//formToTable.js"></script>
</body>
</html>
